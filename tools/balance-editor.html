<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>슬라임 레스토랑 밸런스 편집기</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 24px 90px; background: #1c1109; color: #f3e2c4; font: 14px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p.hint { margin: 0 0 18px; color: #b79a72; }
  nav { display: flex; gap: 6px; margin-bottom: 16px; }
  nav button { border: 1px solid #6d4623; border-radius: 6px; padding: 7px 16px; background: #2e1c0f; color: #f3e2c4; cursor: pointer; }
  nav button[aria-selected="true"] { border-color: #f0b357; background: #4b2d15; color: #ffd98a; }
  section[hidden] { display: none; }
  fieldset { margin: 0 0 16px; border: 1px solid #55361b; border-radius: 8px; padding: 12px 14px; }
  legend { padding: 0 6px; color: #ffd98a; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 18px; }
  label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
  input, select { min-width: 72px; border: 1px solid #6d4623; border-radius: 5px; padding: 5px 7px; background: #241609; color: #f3e2c4; font: inherit; }
  input[type="number"] { width: 82px; text-align: right; }
  input[type="checkbox"] { min-width: 0; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 5px 7px; border-bottom: 1px solid #3d2714; text-align: left; }
  th { color: #d8b183; font-size: 12px; }
  .row-tools { display: flex; gap: 6px; }
  button.small { border: 1px solid #6d4623; border-radius: 5px; padding: 4px 10px; background: #33200f; color: #f3e2c4; cursor: pointer; }
  button.small:hover { border-color: #f0b357; }
  .menu-picks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .menu-picks label { display: inline-flex; grid-template-columns: none; gap: 5px; }
  label.wide { grid-template-columns: 1fr; gap: 5px; }
  label.pick { white-space: nowrap; }
  footer { position: fixed; right: 0; bottom: 0; left: 0; display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-top: 1px solid #55361b; background: #241609; }
  footer button { border: 1px solid #f0b357; border-radius: 6px; padding: 9px 22px; background: #6a3f18; color: #ffd98a; font-weight: 700; cursor: pointer; }
  #status { color: #b79a72; }
  #status[data-tone="bad"] { color: #ff9c86; }
  #status[data-tone="good"] { color: #9fe08a; }
</style>
</head>
<body>
<h1>밸런스 편집기</h1>
<p class="hint">game/balance.json · recipes.json · stages.json을 고칩니다. 저장하면 게임과 같은 규칙으로 검증한 뒤 파일에 씁니다.</p>

<nav>
  <button type="button" data-tab="balance" aria-selected="true">수치</button>
  <button type="button" data-tab="recipes" aria-selected="false">레시피</button>
  <button type="button" data-tab="stages" aria-selected="false">스테이지</button>
</nav>

<section id="tab-balance"></section>

<section id="tab-recipes" hidden>
  <fieldset>
    <legend>레시피</legend>
    <table>
      <thead><tr><th>완성품</th><th>재료</th><th>기구</th><th>담당 속성</th><th></th></tr></thead>
      <tbody id="recipe-rows"></tbody>
    </table>
    <p><button class="small" type="button" id="add-recipe">＋ 레시피 추가</button></p>
  </fieldset>
</section>

<section id="tab-stages" hidden>
  <div id="stage-list"></div>
  <p><button class="small" type="button" id="add-stage">＋ 스테이지 추가</button></p>
</section>

<footer>
  <button type="button" id="save">저장</button>
  <span id="status">불러오는 중…</span>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let data = null;
let list = null;

const itemName = (id) => list.itemLabels[id] ? `${list.itemLabels[id]} (${id})` : id;
const stationName = (id) => list.stationLabels[id] ?? id;
const elementNames = { water: "물", fire: "불", lightning: "번개", earth: "땅" };

function el(tag, props = {}, kids = []) {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of kids) node.append(kid);
  return node;
}

function numberField(label, get, set, min = 0) {
  const input = el("input", { type: "number", min, step: 1, value: get() });
  input.addEventListener("input", () => set(input.valueAsNumber));
  return el("label", {}, [el("span", { textContent: label }), input]);
}

function selectField(label, options, get, set, name = (v) => v) {
  const select = el("select");
  for (const option of options) {
    select.append(el("option", { value: option, textContent: name(option), selected: option === get() }));
  }
  select.addEventListener("change", () => set(select.value));
  return el("label", {}, [el("span", { textContent: label }), select]);
}

// 여러 속성을 고를 수 있는 칸. 기구 하나를 여러 슬라임이 돌릴 수 있다.
function elementPicks(label, get, set) {
  const boxes = list.elements.map((element) => {
    const box = el("input", { type: "checkbox", checked: get().includes(element) });
    box.addEventListener("change", () => {
      set(box.checked
        ? [...get(), element]
        : get().filter((one) => one !== element));
    });
    return el("label", { className: "pick" }, [box, el("span", { textContent: elementNames[element] ?? element })]);
  });
  return el("label", { className: "wide" }, [
    el("span", { textContent: label }),
    el("span", { className: "menu-picks" }, boxes),
  ]);
}

function checkField(label, get, set) {
  const input = el("input", { type: "checkbox", checked: get() });
  input.addEventListener("change", () => set(input.checked));
  return el("label", {}, [el("span", { textContent: label }), input]);
}

function group(title, fields) {
  return el("fieldset", {}, [el("legend", { textContent: title }), el("div", { className: "grid" }, fields)]);
}

function drawBalance() {
  const b = data.balance;
  const root = $("tab-balance");
  root.replaceChildren(
    group("슬라임 턴당 행동력", list.elements.map((element) =>
      numberField(elementNames[element] ?? element, () => b.actionPointsPerTurn[element],
        (v) => { b.actionPointsPerTurn[element] = v; }, 1))),
    group("행동에 드는 행동력", Object.keys(b.actionCost).map((name) =>
      numberField({ move: "이동", carry: "집기·놓기", chop: "조리", wash: "세척", burn: "소각" }[name] ?? name,
        () => b.actionCost[name], (v) => { b.actionCost[name] = v; }, 1))),
    group("기구를 돌리는 속성 (여러 개 고를 수 있음)", Object.keys(b.stationElements).map((job) =>
      elementPicks({ wash: "세척대·믹서기 물", burn: "소각기" }[job] ?? job,
        () => b.stationElements[job], (v) => { b.stationElements[job] = v; }))),
    group("재료 상자", [
      numberField("최대 보관", () => b.ingredients.max, (v) => { b.ingredients.max = v; }, 1),
      numberField("턴마다 보충", () => b.ingredients.perTurn, (v) => { b.ingredients.perTurn = v; }, 1),
    ]),
    group("그릇", [
      numberField("시작 개수", () => b.dish.initialCount, (v) => { b.dish.initialCount = v; }),
      numberField("그릇 상자 용량", () => b.dish.rackCapacity, (v) => { b.dish.rackCapacity = v; }, 1),
      numberField("세척대 용량", () => b.dish.washerCapacity, (v) => { b.dish.washerCapacity = v; }, 1),
      numberField("땅 슬라임 운반 수", () => b.dish.earthDishCarry, (v) => { b.dish.earthDishCarry = v; }, 1),
      numberField("테이블 용량", () => b.dish.tableCapacity, (v) => { b.dish.tableCapacity = v; }, 1),
    ]),
    group("소각기", [
      numberField("최대 보관", () => b.incinerator.capacity, (v) => { b.incinerator.capacity = v; }, 1),
    ]),
    group("주문", [
      numberField("동시에 보이는 수", () => b.orders.activeOrderCount, (v) => { b.orders.activeOrderCount = v; }, 1),
      numberField("미리 보여 줄 수", () => b.orders.previewCount, (v) => { b.orders.previewCount = v; }),
      selectField("주문에 없는 음식", ["reject", "discard"], () => b.orders.invalidSubmission,
        (v) => { b.orders.invalidSubmission = v; }, (v) => v === "reject" ? "거절한다" : "버린다"),
      checkField("주문 소진 시 바로 종료", () => b.orders.endRoundWhenOrdersDone,
        (v) => { b.orders.endRoundWhenOrdersDone = v; }),
    ]),
    group("판정", [
      numberField("별 1개: 추가 처리", () => b.rankThresholds[0], (v) => { b.rankThresholds[0] = v; }),
      numberField("별 2개: 추가 처리", () => b.rankThresholds[1], (v) => { b.rankThresholds[1] = v; }),
      numberField("별 3개: 추가 처리", () => b.rankThresholds[2], (v) => { b.rankThresholds[2] = v; }),
      numberField("마감 임박 턴", () => b.rushTurnsLeft, (v) => { b.rushTurnsLeft = v; }),
      numberField("주문당 골드", () => b.goldPerOrder, (v) => { b.goldPerOrder = v; }),
    ]),
  );
}

// 레시피 담당 속성도 여러 개다.
function workerCell(recipe) {
  const boxes = list.elements.map((element) => {
    const box = el("input", { type: "checkbox", checked: recipe.workers.includes(element) });
    box.addEventListener("change", () => {
      recipe.workers = box.checked
        ? [...recipe.workers, element]
        : recipe.workers.filter((one) => one !== element);
    });
    return el("label", { className: "pick" }, [box, el("span", { textContent: elementNames[element] ?? element })]);
  });
  return el("td", { className: "menu-picks" }, boxes);
}

function drawRecipes() {
  const rows = data.recipes.map((recipe, index) => {
    const pick = (key, options, name) => {
      const select = el("select");
      for (const option of options) {
        select.append(el("option", { value: option, textContent: name(option), selected: option === recipe[key] }));
      }
      select.addEventListener("change", () => { recipe[key] = select.value; drawStages(); });
      return el("td", {}, [select]);
    };
    const remove = el("button", { className: "small", type: "button", textContent: "삭제" });
    remove.addEventListener("click", () => { data.recipes.splice(index, 1); drawRecipes(); drawStages(); });
    return el("tr", {}, [
      pick("foodId", list.items, itemName),
      pick("ingredient", list.items, itemName),
      pick("station", list.cooktops, stationName),
      workerCell(recipe),
      el("td", { className: "row-tools" }, [remove]),
    ]);
  });
  $("recipe-rows").replaceChildren(...rows);
}

function drawStages() {
  const cards = data.stages.map((stage, index) => {
    const textField = (label, key, max) => {
      const input = el("input", { type: "text", value: stage[key], maxLength: max });
      input.addEventListener("input", () => { stage[key] = input.value; });
      return el("label", {}, [el("span", { textContent: label }), input]);
    };
    const picks = data.recipes.map((recipe) => {
      const box = el("input", { type: "checkbox", checked: stage.menu.includes(recipe.foodId) });
      box.addEventListener("change", () => {
        stage.menu = box.checked
          ? [...stage.menu, recipe.foodId]
          : stage.menu.filter((one) => one !== recipe.foodId);
      });
      return el("label", {}, [box, el("span", { textContent: itemName(recipe.foodId) })]);
    });
    const remove = el("button", { className: "small", type: "button", textContent: "스테이지 삭제" });
    remove.addEventListener("click", () => { data.stages.splice(index, 1); drawStages(); });
    const up = el("button", { className: "small", type: "button", textContent: "↑" });
    up.addEventListener("click", () => {
      if (index === 0) return;
      data.stages.splice(index - 1, 0, data.stages.splice(index, 1)[0]);
      drawStages();
    });
    return el("fieldset", {}, [
      el("legend", { textContent: `${stage.id} ${stage.name}` }),
      el("div", { className: "grid" }, [
        textField("번호", "id", 12),
        textField("이름", "name", 30),
        numberField("제한 턴", () => stage.turnLimit, (v) => { stage.turnLimit = v; }, 1),
        numberField("나오는 주문 수", () => stage.orderCount, (v) => { stage.orderCount = v; }, 1),
        numberField("통과 기준", () => stage.requiredOrders, (v) => { stage.requiredOrders = v; }, 1),
      ]),
      el("p", { textContent: "이 스테이지에 나오는 레시피" }),
      el("div", { className: "menu-picks" }, picks),
      el("p", { className: "row-tools" }, [up, remove]),
    ]);
  });
  $("stage-list").replaceChildren(...cards);
}

function setStatus(text, tone = "") {
  const node = $("status");
  node.textContent = text;
  node.dataset.tone = tone;
}

for (const button of document.querySelectorAll("nav button")) {
  button.addEventListener("click", () => {
    for (const other of document.querySelectorAll("nav button")) {
      const on = other === button;
      other.setAttribute("aria-selected", String(on));
      $(`tab-${other.dataset.tab}`).hidden = !on;
    }
  });
}

$("add-recipe").addEventListener("click", () => {
  data.recipes.push({
    foodId: list.items[0], ingredient: list.items[0],
    station: list.cooktops[0], workers: [list.elements[0]],
  });
  drawRecipes();
  drawStages();
});

$("add-stage").addEventListener("click", () => {
  data.stages.push({
    id: String(data.stages.length), name: "새 스테이지",
    turnLimit: 60, requiredOrders: 1, orderCount: 3,
    menu: data.recipes.length ? [data.recipes[0].foodId] : [],
  });
  drawStages();
});

$("save").addEventListener("click", async () => {
  setStatus("저장 중…");
  const response = await fetch("/data", {
    method: "PUT",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ balance: data.balance, recipes: data.recipes, stages: data.stages }),
  });
  const body = await response.json();
  if (response.ok) return setStatus("저장했습니다. 게임을 새로 고치면 반영됩니다.", "good");
  setStatus(body.errors.join(" "), "bad");
});

(async () => {
  const response = await fetch("/data");
  const body = await response.json();
  data = { balance: body.balance, recipes: body.recipes, stages: body.stages };
  list = body.catalog;
  drawBalance();
  drawRecipes();
  drawStages();
  setStatus("불러왔습니다.");
})();
</script>
</body>
</html>
