<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>슬라임 레스토랑 로컬 맵 에디터</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; --gold:#ffd46b; --panel:#28223a; --line:#675a7d; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#12101e; color:#faf2ff; }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:18px 24px; border-bottom:1px solid var(--line); background:#211c31; }
    h1,h2,p { margin:0; } h1 { font-size:22px; } header p { color:#bfb2d6; font-size:13px; }
    main { display:grid; grid-template-columns:minmax(620px,1fr) 330px; gap:20px; padding:20px; }
    .board-shell,.side { border:1px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 18px 50px #0005; }
    .board-shell { padding:18px; }
    .board { display:grid; grid-template-columns:repeat(14,1fr); aspect-ratio:14/8; overflow:hidden; border:3px solid #f7e3b0; border-radius:10px; background:#3e2414; touch-action:none; }
    .cell { position:relative; display:grid; place-items:center; min-width:0; border:1px solid #2a160b80; padding:0; background:#4b2c19; color:#fff; font-size:clamp(10px,1.7vw,24px); cursor:crosshair; }
    .cell[data-tile="#"] { background:#a66f38; box-shadow:inset 0 0 0 2px #d5a46755; }
    .cell[data-station] { background:#76503a; box-shadow:inset 0 0 0 2px #fff4; }
    .marker { position:absolute; border-radius:999px; padding:1px 4px; background:#171427e8; color:#fff; font-size:9px; }
    .marker.spawn { top:2px; left:2px; color:#ffe47e; }
    .side { display:grid; align-content:start; gap:16px; padding:18px; }
    .local { border:1px solid #5c9c69; border-radius:10px; padding:10px; background:#173022; color:#a9e8b4; font-size:12px; }
    .palette { display:grid; gap:8px; } .palette section { display:grid; gap:6px; }
    .palette h2 { color:#cfc1e2; font-size:13px; }
    .tools { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
    button { border:1px solid #75678f; border-radius:9px; padding:8px; background:#43395b; color:#fff; cursor:pointer; font:inherit; }
    button:hover,button:focus-visible { border-color:var(--gold); outline:none; }
    select { width:100%; border:1px solid #75678f; border-radius:9px; padding:8px; background:#171427; color:#fff; font:inherit; }
    .tools button[aria-pressed="true"] { border-color:#fff; box-shadow:0 0 0 2px var(--gold); background:#5b4978; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .save { background:var(--gold); color:#21192c; font-weight:800; }
    #status { min-height:42px; border-radius:9px; padding:9px; background:#171427; color:#c9bddc; font-size:12px; white-space:pre-line; }
    #status[data-error] { color:#ffb6c8; }
    .help { color:#bfb2d6; font-size:12px; line-height:1.5; }
    @media (max-width:900px) { main { grid-template-columns:1fr; } .board-shell { overflow-x:auto; } .board { min-width:620px; } }
  </style>
</head>
<body>
  <header><div><h1>슬라임 레스토랑 맵 에디터</h1><p>14×8 게임 맵을 직접 편집하고 저장합니다.</p></div><strong>LOCAL ONLY</strong></header>
  <main>
    <section class="board-shell" aria-label="맵 편집 영역"><div class="board" id="board" role="grid" aria-label="14×8 맵"></div></section>
    <aside class="side">
      <p class="local">이 도구는 127.0.0.1에서만 실행되며 배포 게임에는 포함되지 않습니다.</p>
      <div class="palette" id="palette"></div>
      <div class="actions"><button class="save" id="save">저장 및 적용</button><button id="reload">다시 불러오기</button></div>
      <p id="status" role="status" aria-live="polite">맵을 불러오는 중…</p>
      <p class="help">바닥·조리대는 마우스 왼쪽 버튼을 누른 동안만 드래그해서 칠합니다. 설비는 같은 종류를 여러 번 놓을 수 있고, 모든 기구는 붙어 있는 어느 방향에서든 쓸 수 있습니다. 제출대와 세척대는 2칸짜리라 가로나 세로로 두 칸을 나란히 칠해야 합니다. 슬라임 위치는 속성 버튼을 고른 뒤 빈 바닥을 클릭해 지정합니다.</p>
    </aside>
  </main>
  <script>
    const stations = [
      ["potato-box","P","🥔","감자 상자",1],["carrot-box","R","🥕","당근 상자",1],["cabbage-box","A","🥬","양배추 상자",1],
      ["banana-box","B","🍌","바나나 상자",1],["strawberry-box","Y","🍓","딸기 상자",1],["mushroom-box","U","🍄","버섯 상자",1],
      ["stove","C","🔪","도마",1],["oven","O","🔥","화덕",1],["fryer","F","🍟","튀김기",1],["blender","M","🥤","믹서기",1],
      ["submission","S","📬","음식 제출대",2],["trash","X","🗑️","소각기",1],
      ["dish-rack","D","🍽️","그릇 상자",1],["dish-return","N","🍴","그릇 반납대",1],
      ["washer","W","🫧","세척대",2],["table","T","▤","테이블",1]
    ];
    const elements = [["water","💧","물"],["fire","🔥","불"],["lightning","⚡","번개"],["earth","🌱","땅"]];
    const palette = document.querySelector("#palette"), board = document.querySelector("#board"), status = document.querySelector("#status");
    let data, dirty = false, brush = { kind:"tile", value:"." };
    const tools = [
      ["타일", [["tile",".","바닥"],["tile","#","조리대/벽"]]],
      ["설비", stations.map(([id,code,icon,label,size]) => ["station",code,`${icon} ${label}${size > 1 ? ` ${size}칸` : ""}`])],
      ["슬라임 위치", elements.map(([id,icon,label]) => ["spawn",id,`${icon} ${label}`])],
    ];
    for (const [title, items] of tools) {
      const section = document.createElement("section"), heading = document.createElement("h2"), group = document.createElement("div");
      heading.textContent = title; group.className = "tools"; section.append(heading, group);
      for (const [kind,value,label] of items) {
        const button = document.createElement("button"); button.type = "button"; button.textContent = label; button.dataset.kind = kind; button.dataset.value = value;
        button.addEventListener("click", () => { brush = { kind, value }; document.querySelectorAll(".tools button").forEach((item) => item.setAttribute("aria-pressed", String(item === button))); });
        group.append(button);
      }
      palette.append(section);
    }
    document.querySelector('.tools button[data-value="."]').click();
    const setRow = (row, col, value) => data.rows[row] = data.rows[row].slice(0,col) + value + data.rows[row].slice(col + 1);
    const stationEntries = () => data.rows.flatMap((line,row) => [...line].flatMap((tile,col) => {
      const station = stations.find(([,code]) => code === tile);
      return station ? [{ id:`${station[0]}@${col},${row}`, type:station[0], icon:station[2], label:station[3], col, row }] : [];
    }));
    function apply(col,row) {
      if (!data) return;
      if (brush.kind === "tile") {
        if (data.rows[row][col] === brush.value) return;
        setRow(row,col,brush.value);
        const cell = board.querySelector(`[data-col="${col}"][data-row="${row}"]`);
        if (cell) {
          const markers = [...cell.querySelectorAll(".marker")];
          cell.dataset.tile = brush.value; cell.removeAttribute("data-station"); cell.replaceChildren(...markers);
          cell.setAttribute("aria-label", `${col + 1}열 ${row + 1}행 ${brush.value === "#" ? "조리대" : "바닥"}`);
        }
      }
      if (brush.kind === "station") setRow(row,col,brush.value);
      if (brush.kind === "spawn") data.spawnTiles[brush.value] = { col,row };
      dirty = true; status.textContent = "저장되지 않은 변경 사항이 있습니다."; status.removeAttribute("data-error");
      render();
    }
    function render() {
      board.replaceChildren();
      data.rows.forEach((line,row) => [...line].forEach((tile,col) => {
        const cell = document.createElement("button"), station = stations.find(([,code]) => code === tile);
        cell.type = "button"; cell.className = "cell"; cell.dataset.tile = tile; cell.dataset.col = col; cell.dataset.row = row; cell.setAttribute("role","gridcell");
        cell.setAttribute("aria-label", `${col + 1}열 ${row + 1}행 ${station ? station[3] : tile === "#" ? "조리대" : "바닥"}`);
        if (station) { cell.dataset.station = station[0]; cell.textContent = station[2]; }
        for (const [id,icon,label] of elements) {
          const spot = data.spawnTiles?.[id];
          if (spot?.col !== col || spot?.row !== row) continue;
          const badge = document.createElement("span"); badge.className = "marker spawn"; badge.textContent = `${icon}${label}`; cell.append(badge);
        }
        board.append(cell);
      }));
    }
    const applyAtPointer = (event) => {
      const cell = event.target instanceof Element ? event.target.closest(".cell") : null;
      if (cell) apply(Number(cell.dataset.col), Number(cell.dataset.row));
    };
    let painting = false;
    board.addEventListener("pointerdown", (event) => { if (event.button === 0) { painting = true; board.setPointerCapture(event.pointerId); event.preventDefault(); applyAtPointer(event); } });
    board.addEventListener("pointermove", (event) => { if (painting && (event.buttons & 1) && brush.kind === "tile") applyAtPointer(event); });
    const stopPainting = () => { painting = false; };
    board.addEventListener("pointerup", stopPainting); board.addEventListener("pointercancel", stopPainting); board.addEventListener("lostpointercapture", stopPainting);
    async function load() {
      // 파일을 그냥 열면 /map을 부를 서버가 없어 fetch가 "Failed to fetch"로 끝난다.
      if (!location.protocol.startsWith("http")) throw new Error("이 파일을 직접 열면 맵을 불러올 수 없습니다. 터미널에서 `npm run map:edit`을 실행한 뒤 http://127.0.0.1:4173 으로 접속하세요.");
      const response = await fetch("/map", { cache:"no-store" });
      const body = await response.json();
      if (!response.ok) throw new Error(body.errors?.join("\n") ?? `맵을 불러오지 못했습니다. (${response.status})`);
      data = body; dirty = false; status.textContent = "현재 게임 맵을 불러왔습니다."; status.removeAttribute("data-error"); render();
    }
    document.querySelector("#save").addEventListener("click", async () => {
      const response = await fetch("/map", { method:"PUT", headers:{"content-type":"application/json"}, body:JSON.stringify(data) });
      const result = await response.json();
      if (!response.ok) { status.dataset.error = ""; status.textContent = result.errors.join("\n"); return; }
      dirty = false; status.removeAttribute("data-error"); status.textContent = "저장 완료. 게임을 새로고침하면 바로 적용됩니다.";
    });
    const showError = (error) => { status.dataset.error = ""; status.textContent = error.message; };
    document.querySelector("#reload").addEventListener("click", () => { if (!dirty || confirm("저장하지 않은 변경을 버릴까요?")) load().catch(showError); });
    addEventListener("beforeunload", (event) => { if (dirty) event.preventDefault(); });
    load().catch(showError);
  </script>
</body>
</html>
