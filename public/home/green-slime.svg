<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1018"
     height="784"
     viewBox="120 258 1018 784"
     role="img"
     aria-labelledby="title desc">
  <title id="title">귀여운 초록색 슬라임</title>
  <desc id="desc">반투명한 연두색 막 안에서 쫀득하게 숨 쉬고 눈을 깜빡이는 초록 슬라임</desc>

  <defs>
    <linearGradient id="outerShell" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#a8dda0"/>
      <stop offset="0.58" stop-color="#9bd795"/>
      <stop offset="1" stop-color="#a9dfa3"/>
    </linearGradient>
    <radialGradient id="innerBody" cx="50%" cy="44%" r="67%">
      <stop offset="0" stop-color="#65c853"/>
      <stop offset="0.72" stop-color="#58bd49"/>
      <stop offset="1" stop-color="#51b745"/>
    </radialGradient>
    <style>
      #slime {
        transform-box: fill-box;
        transform-origin: 50% 88%;
        animation: breathe 3.2s cubic-bezier(.45, 0, .28, 1) infinite;
      }
      #inner {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: belly 3.2s cubic-bezier(.45, 0, .28, 1) infinite;
      }
      #face {
        transform-box: fill-box;
        transform-origin: center;
        animation: face-float 3.2s ease-in-out infinite;
      }
      #eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: blink 5.4s ease-in-out infinite;
      }
      #shine {
        transform-box: fill-box;
        transform-origin: center;
        animation: shine 3.2s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 32%, 100% { transform: translateY(0) scale(1); }
        46% { transform: translateY(-13px) scale(.985, 1.035); }
        58% { transform: translateY(8px) scale(1.035, .965); }
        69% { transform: translateY(-3px) scale(.995, 1.012); }
      }
      @keyframes belly {
        0%, 32%, 100% { transform: scale(1); }
        46% { transform: scale(.975, 1.045); }
        58% { transform: scale(1.045, .94); }
        69% { transform: scale(.99, 1.015); }
      }
      @keyframes face-float {
        0%, 32%, 100% { transform: translateY(0); }
        46% { transform: translateY(-8px); }
        58% { transform: translateY(7px) scaleY(.96); }
      }
      @keyframes blink {
        0%, 45%, 49%, 100% { transform: scaleY(1); }
        47% { transform: scaleY(.12); }
      }
      @keyframes shine {
        0%, 100% { transform: translate(0, 0) rotate(0); opacity: .72; }
        48% { transform: translate(8px, -7px) rotate(-3deg); opacity: .9; }
      }
      @media (prefers-reduced-motion: reduce) {
        #slime, #inner, #face, #eyes, #shine { animation: none; }
      }
    </style>
  </defs>

  <g id="slime">
    <path
      d="M 627 300 C 844 300 1028 438 1081 623 C 1124 775 1070 900 961 954 C 875 997 743 1000 627 1000 C 491 1000 354 994 265 939 C 178 886 145 787 169 652 C 208 433 399 300 627 300 Z"
      fill="none"
      stroke="#ffffff"
      stroke-width="49"
      stroke-linejoin="round"/>
    <path
      d="M 627 300 C 844 300 1028 438 1081 623 C 1124 775 1070 900 961 954 C 875 997 743 1000 627 1000 C 491 1000 354 994 265 939 C 178 886 145 787 169 652 C 208 433 399 300 627 300 Z"
      fill="url(#outerShell)"
      stroke="#000000"
      stroke-width="29"
      stroke-linejoin="round"/>

    <g id="inner">
      <path
        d="M 272 681 C 291 560 433 480 615 472 C 808 463 938 545 974 665 C 1001 756 973 831 900 868 C 822 908 435 913 345 871 C 281 841 257 777 272 681 Z"
        fill="url(#innerBody)"/>
    </g>

    <ellipse id="shine"
      cx="410"
      cy="439"
      rx="58"
      ry="28"
      transform="rotate(-36 410 439)"
      fill="#e8f7df"
      opacity="0.72"/>

    <g id="face">
      <g id="eyes">
        <circle cx="526" cy="676" r="33" fill="#000000"/>
        <circle cx="726" cy="676" r="33" fill="#000000"/>
      </g>
      <path
        d="M 581 718 H 671 A 45 50 0 0 1 581 718 Z"
        fill="#000000"/>
    </g>
  </g>
</svg>
